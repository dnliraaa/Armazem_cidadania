# ============================================================
# Armazém da Cidadania — configuração do Nginx (produção)
#
# Troque TODAS as ocorrências de SEUDOMINIO.com pelo domínio real antes de
# usar (ver deploy/DEPLOY.md, passo 14).
#
# Depois de colocar este arquivo em /etc/nginx/sites-available/ e ativá-lo,
# rode `sudo certbot --nginx -d app.SEUDOMINIO.com` (passo 15 do DEPLOY.md).
# O Certbot edita este arquivo automaticamente, adicionando o bloco HTTPS
# (porta 443, com os caminhos dos certificados) e o redirecionamento de
# HTTP para HTTPS — não é preciso escrever esse bloco à mão aqui.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.SEUDOMINIO.com;

    root /opt/armazem-da-cidadania/frontend/dist;
    index index.html;

    # Arquivos com hash no nome (JS/CSS gerados pelo build do Vite) podem
    # cachear por muito tempo — o próprio nome do arquivo muda quando o
    # conteúdo muda, então cache "immutable" aqui é seguro.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA (React Router): qualquer rota que não seja um arquivo existente
    # cai no index.html, para o roteamento do lado do cliente assumir.
    location / {
        try_files $uri /index.html;
    }

    # Backend Node (API) — roda localmente via PM2 na porta 3333
    location /api/ {
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

