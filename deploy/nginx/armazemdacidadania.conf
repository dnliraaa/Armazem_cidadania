# ============================================================================
# Nginx — Armazém da Cidadania (armazemdacidadania.tech + db.armazemdacidadania.tech)
# ============================================================================
# Instalação (ver deploy/DEPLOY.md):
#   sudo cp deploy/nginx/armazemdacidadania.conf /etc/nginx/sites-available/armazemdacidadania
#   sudo ln -s /etc/nginx/sites-available/armazemdacidadania /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d armazemdacidadania.tech -d www.armazemdacidadania.tech -d db.armazemdacidadania.tech
#
# O certbot (--nginx) emite os certificados e EDITA este arquivo: acrescenta a escuta na 443 com
# os certificados e cria o redirecionamento HTTP → HTTPS. Por isso aqui só há blocos na porta 80;
# todas as diretivas abaixo (cabeçalhos, gzip, limites, proxies) passam a valer também no HTTPS.
# ============================================================================

# Limite de tentativas de login por IP (proteção contra força bruta no endpoint do Auth).
limit_req_zone $binary_remote_addr zone=login_auth:10m rate=10r/m;

# ----------------------------------------------------------------------------
# Sistema (frontend estático + API Node)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name armazemdacidadania.tech www.armazemdacidadania.tech;

    # Build do frontend (copiado por deploy/deploy.sh).
    root /var/www/armazemdacidadania;
    index index.html;

    # --- Limites e compressão ---
    client_max_body_size 5m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;
    server_tokens off;

    # --- Cabeçalhos de segurança básicos ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: só tem efeito no HTTPS (que o certbot habilita neste mesmo bloco).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Arquivos com hash no nome (JS/CSS do Vite) podem ser cacheados "para sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header em um location apaga os herdados: repete os de segurança.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API Node (PM2) em 127.0.0.1:3333. SEM barra no fim do proxy_pass: o prefixo /api é
    # mantido, porque o backend registra as rotas em /api/...
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA (React Router): qualquer rota que não seja arquivo cai no index.html.
    # O index.html nunca deve ficar em cache (ele aponta para os arquivos novos do build).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri /index.html;
    }
}

# ----------------------------------------------------------------------------
# API do Supabase (Kong em 127.0.0.1:8000) — SOMENTE o que o navegador precisa
# ----------------------------------------------------------------------------
# O frontend só usa o Auth (login). O backend fala com o Kong direto, por 127.0.0.1, sem passar
# por aqui. Por isso só /auth/v1/ é publicado: /rest/v1/ (acesso direto ao banco via chave
# pública "anon") fica FECHADO para a internet, assim como o Studio.
server {
    listen 80;
    listen [::]:80;
    server_name db.armazemdacidadania.tech;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Login (troca de senha por token): com limite de tentativas por IP.
    location = /auth/v1/token {
        limit_req zone=login_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demais rotas do Auth usadas pelo navegador (/user, /logout, /verify...).
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo o resto (inclusive /rest/v1/, Studio e meta) não existe para a internet.
    location / {
        return 404;
    }
}
